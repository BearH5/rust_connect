[package]
name = "gp-tunnel"
version = "0.1.0"
edition = "2021"
publish = false

# GlobalProtect GPST 隧道协议实现（纯 Rust，不依赖 openconnect）。
# 参考 openconnect gpst.c 的字节级实现：
#   - 标准 TLS（无指纹要求），用 native-tls
#   - 16 字节帧头（magic/ethertype/len/one/zero，字节序混合）
#   - GET 握手读 "START_TUNNEL"
#   - getconfig.esp 拉配置
#   - DPD/keepalive 10 秒周期

[dependencies]
# TLS：跨平台（Windows schannel / Linux openssl），能拿到底层流做阻塞读写
native-tls = "0.2"
# getconfig.esp 的 HTTP 请求
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
# XML 解析（getconfig 响应）
roxmltree = "0.20"
# URL 编码表单字段
urlencoding = "2"
# 错误派生
thiserror = "1"
# 序列化（配置结构给 ec-app 用）
serde = { version = "1", features = ["derive"] }
# 日志
log = "0.4"

[dev-dependencies]
# examples/tunnel_test.rs 用：登录拿 cookie 后建隧道
env_logger = "0.11"
gp-login = { path = "../gp-login" }
